<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>现货白银行情1</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<!-- 顶部导航栏 -->
<div class="nav-bar">
  <button class="nav-btn back-btn" id="backBtn" title="返回">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <span class="nav-title">美元账户白银</span>
  <button class="nav-btn refresh-btn" id="refreshBtn" title="刷新">
    <svg id="refreshIcon" width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path d="M23 4v6h-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 20v-6h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>刷新</span>
  </button>
</div>

<!-- 免责声明 -->
<div class="disclaimer">
  <span class="disclaimer-icon">⚠</span>
  注：本页面贵金属行情报价仅供参考，具体请以实际交易时的报价为准。
</div>

<!-- 价格数据网格 -->
<div class="price-grid">
  <div class="price-row">
    <div class="price-item">
      <span class="price-label">银行买入价</span>
      <span class="price-value green" id="buyPrice">--</span>
    </div>
    <div class="price-item">
      <span class="price-label">银行卖出价</span>
      <span class="price-value green" id="sellPrice">--</span>
    </div>
  </div>
  <div class="price-row">
    <div class="price-item">
      <span class="price-label">最高价</span>
      <span class="price-value" id="highPrice">--</span>
    </div>
    <div class="price-item">
      <span class="price-label">最低价</span>
      <span class="price-value" id="lowPrice">--</span>
    </div>
  </div>
  <div class="price-row">
    <div class="price-item">
      <span class="price-label">中间价</span>
      <span class="price-value" id="midPrice">--</span>
    </div>
    <div class="price-item">
      <span class="price-label">单位</span>
      <span class="price-value unit-label">美元/盎司</span>
    </div>
  </div>
  <div class="price-row">
    <div class="price-item">
      <span class="price-label">涨跌幅%</span>
      <span class="price-value" id="changePercent">--</span>
    </div>
    <div class="price-item">
      <span class="price-label">查询时间</span>
      <span class="price-value time-value" id="queryTime">--</span>
    </div>
  </div>
</div>

<!-- 图表类型切换（可横向滚动）-->
<div class="chart-tabs-wrapper">
  <div class="chart-tabs">
    <button class="tab-btn active" data-tab="realtime">实时曲线</button>
    <button class="tab-btn" data-tab="1min">1分钟</button>
    <button class="tab-btn" data-tab="5min">5分钟</button>
    <button class="tab-btn" data-tab="1hour">1小时</button>
    <button class="tab-btn" data-tab="4hour">4小时</button>
    <button class="tab-btn" data-tab="daily">日K</button>
    <button class="tab-btn" data-tab="weekly">周K</button>
    <button class="tab-btn" data-tab="monthly">月K</button>
  </div>
</div>

<!-- 图表区域 -->
<div class="chart-container">
  <canvas id="priceChart" width="420" height="260"></canvas>
  <div class="chart-loading" id="chartLoading">
    <div class="loading-spinner"></div>
    <span>加载中...</span>
  </div>
  <div class="chart-empty" id="chartEmpty" style="display:none">
    <span>暂无数据</span>
  </div>
</div>

<!-- 底部设置栏 -->
<div class="settings-bar">
  <div class="settings-left">
    <span class="settings-label">自动刷新</span>
    <label class="toggle-switch">
      <input type="checkbox" id="autoRefreshToggle" />
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div class="settings-right">
    <span class="settings-label">频率</span>
    <select id="refreshInterval" class="interval-select">
      <option value="1">1秒</option>
      <option value="5">5秒</option>
      <option value="10">10秒</option>
      <option value="30" selected>30秒</option>
      <option value="60">1分钟</option>
    </select>
  </div>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span class="status-text" id="statusText">等待数据...</span>
  <span class="last-update" id="lastUpdate"></span>
</div>

<script src="chart.js"></script>
<script src="popup.js"></script>
</body>
</html>
